<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava | ESP32 Backend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/login.css">
</head>
<body>
    <main class="container login-layout">
        <section class="card login-card shadow-lg">
            <div class="card-body p-4 p-md-5">
                <div class="login-mark mb-4" aria-hidden="true">E</div>
                <p class="eyebrow mb-2">ESP32 BACKEND</p>
                <h1 class="h2 mb-2">Dobro došli</h1>
                <p class="text-secondary mb-4">Prijavite se za nastavak na svoje sučelje.</p>

                <div id="login-message" class="alert d-none" role="alert" aria-live="polite"></div>

                <form id="login-form">
                    <div class="mb-3">
                        <label class="form-label" for="email">Email adresa</label>
                        <input
                            class="form-control form-control-lg"
                            id="email"
                            name="email"
                            type="email"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="mb-4">
                        <label class="form-label" for="password">Lozinka</label>
                        <input
                            class="form-control form-control-lg"
                            id="password"
                            name="password"
                            type="password"
                            autocomplete="current-password"
                            required
                        >
                    </div>

                    <button id="login-button" class="btn btn-primary btn-lg w-100" type="submit">
                        Prijavi se
                    </button>
                </form>

                <p class="text-secondary text-center mt-4 mb-0">
                    Za izradu računa obratite se administratoru.
                </p>
            </div>
        </section>
    </main>

    <footer class="site-footer text-center py-4 px-3">
        <small>© 2026 ESP32 Backend. Sva prava pridržana. Developed by Nenad Kežić.</small>
    </footer>

    <script src="/scripts/login.js" defer></script>
</body>
</html>
