<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kreiranje korisničkog računa | ESP32 Backend</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/style/style.css">
    <link rel="stylesheet" href="/style/create-user.css">
</head>
<body>
    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-9 col-lg-7 col-xl-6">
                <section class="card shadow-lg">
                    <div class="card-body p-4 p-md-5">
                        <a class="back-link" href="/login">← Prijava</a>
                        <h1 class="h2 mt-4 mb-2">Kreiranje korisničkog računa</h1>
                        <p class="text-secondary mb-4">Ispunite podatke za izradu novog računa.</p>

                        <div id="form-message" class="alert d-none" role="alert" aria-live="polite"></div>

                        <form id="create-user-form">
                            <div class="mb-3">
                                <label for="name" class="form-label">Ime i prezime</label>
                                <input
                                    type="text"
                                    class="form-control"
                                    id="name"
                                    name="name"
                                    minlength="2"
                                    maxlength="100"
                                    autocomplete="name"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="email" class="form-label">Email adresa</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    maxlength="254"
                                    autocomplete="email"
                                    required
                                >
                            </div>

                            <div class="mb-3">
                                <label for="password" class="form-label">Lozinka</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="password"
                                    name="password"
                                    minlength="8"
                                    autocomplete="new-password"
                                    aria-describedby="password-help"
                                    required
                                >
                                <div id="password-help" class="form-text">Lozinka mora imati najmanje 8 znakova.</div>
                            </div>

                            <div class="mb-4">
                                <label for="confirm-password" class="form-label">Potvrdite lozinku</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="confirm-password"
                                    name="confirmPassword"
                                    minlength="8"
                                    autocomplete="new-password"
                                    required
                                >
                            </div>

                            <button id="submit-button" class="btn btn-primary w-100" type="submit">
                                Kreiraj račun
                            </button>
                        </form>

                        <p class="text-secondary text-center mt-4 mb-0">
                            Već imaš račun? <a class="back-link" href="/login">Prijavi se</a>
                        </p>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <footer class="site-footer text-center py-4 px-3">
        <small>© 2026 SmartGrowBox. Sva prava pridržana. Developed by Nenad Kežić.</small>
    </footer>

    <script src="/scripts/create-user.js" defer></script>
</body>
</html>
